[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmc-gate"
version = "0.1.0"
description = "Coast Range TMC — overnight fire-upslope reopen-gate for D5-shaped SHN"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Coast Range TMC" }]
dependencies = [
  "shapely>=2.0",
  "functions-framework>=3.8",
  "flask>=3.0",
  "pypdf>=5.0",
  "pillow>=10.0",
  "google-adk>=1.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
gcp = [
  "google-adk>=1.0",
  "google-genai>=1.0",
  "google-cloud-firestore>=2.16",
  "google-cloud-bigquery>=3.25",
  "google-cloud-pubsub>=2.23",
  "google-cloud-storage>=2.18",
  "google-cloud-secret-manager>=2.20",
  "earthengine-api>=1.1",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
